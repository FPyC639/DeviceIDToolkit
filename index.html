<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Page</title>

    <!-- ✅ Bulma CSS -->
    <link rel="stylesheet" href="node_modules/bulma/css/bulma.min.css">

    <!-- Optional custom overrides -->
    <style>
        #output {
            color: red;
        }
        html {
            font-size: 18px; /* Bulma default is 16px */
        }
    </style>
</head>
<body class="section">
    <div class="container">

        <!-- Dropdown -->
        <div class="field">
            <label class="label" for="combo-box">Select an Option:</label>
            <div class="control">
                <div class="select">
                    <select id="combo-box"></select>
                </div>
            </div>
        </div>

        <!-- Fetch Button -->
        <div class="field">
            <div class="control">
                <button class="button is-primary" id="fetch-data-btn">Fetch Data</button>
            </div>
        </div>

        <!-- Column Selector -->
        <div class="field">
            <label class="label" for="column-selector">Choose Columns:</label>
            <div class="control" id="columns-area">
                <!-- checkboxes will be rendered here -->
            </div>
        </div>

        <!-- Output area for messages -->
        <div id="output" class="has-text-danger mb-4"></div>

        <!-- Table -->
        <table class="table is-fullwidth is-striped is-hoverable" id="data-table">
            <thead>
                <tr></tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- 🧠 Explain Data Button -->
        <div class="field mt-5">
            <label class="label">AI Explanation</label>
            <div class="control">
                <button class="button is-link is-light" id="explain-data-btn">🧠 Explain This Data</button>
            </div>
        </div>
        
        

        <!-- Status Dropdown -->
        <div class="field">
            <label class="label" for="status-dropdown">Status:</label>
            <div class="control">
            <div class="select">
                <select id="status-dropdown">
                <option value="running">Running</option>
                <option value="stopped">Stopped</option>
                </select>
            </div>
            </div>
        </div>
        <!-- Submit Button for Llama Query -->
        <div class="field mt-4">
            <div class="control">
                <button class="button is-success" id="submit-llama-query-btn">Submit Llama Query</button>
            </div>
        </div>
    </div>

    <!-- 🧠 AI Response Output -->
        <div class="field">
            <div class="control">
                <pre id="llama-response" class="box has-background-light p-4" style="white-space: pre-wrap;"></pre>
            </div>
        </div>

    <script src="render.js"></script>
</body>
</html>
