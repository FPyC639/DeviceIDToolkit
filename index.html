<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        #data-table th, #data-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        #data-table th {
            background-color: #f2f2f2;
        }

        #fetch-data-btn {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- ComboBox (Dropdown) -->
    <label for="combo-box">Select an Option:</label>
    <select id="combo-box"></select>

    <!-- Button to Trigger Data Fetch -->
    <button id="fetch-data-btn">Fetch Data</button>

    <!-- Column Selector -->
    <label for="column-selector">Choose Columns:</label>
    <div id="columns-area"></div>

    <!-- Output area for errors or status -->
    <div id="output" style="color: red;"></div>

    <!-- Table Structure -->
    <table id="data-table">
        <thead>
            <tr></tr>
        </thead>
        <tbody></tbody>
    </table>

    <!-- Link to External JavaScript File -->
    <script src="render.js"></script>
</body>
</html>
